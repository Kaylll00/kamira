<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puzzle Cam - Gesture Capture</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="theme-cyberpunk">

<div id="app">

  <div id="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="sceneCanvas"></canvas>

    <div class="hud-top">
      <div class="brand">PUZZLE.CAM <small>hand-frame capture</small></div>
      <div class="status-pill">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">starting camera...</span>
      </div>
    </div>

    <div id="progressBadge" class="progress-badge">
      <span id="progressText">0 / 9 pieces placed</span>
    </div>

    <div id="loadingOverlay">
      <div class="loader-text" id="loaderText">loading AI vision models...</div>
      <div class="loader-bar"></div>
      <button type="button" id="loaderRetry" class="loader-retry hidden">Retry</button>
    </div>

    <div id="errorBanner"></div>
  </div>

  <aside id="gallery">
    <div class="gallery-head">
      <span class="gallery-title">Capture Strip</span>
      <span class="gallery-count" id="galleryCount">0 / 3</span>
    </div>

    <section class="control-panel" aria-label="Personalization controls">
      <div class="control-block">
        <label class="control-label" for="themeSelect">Theme</label>
        <select id="themeSelect" class="control-input">
          <option value="cyberpunk">Neon cyberpunk</option>
          <option value="studio">Minimalist studio</option>
          <option value="sunset">Sunset / tropical</option>
          <option value="arcade">Retro arcade</option>
        </select>
      </div>

      <div class="control-block">
        <label class="control-label" for="backgroundFxSelect">Camera FX</label>
        <select id="backgroundFxSelect" class="control-input">
          <option value="aurora">Background blur</option>
          <option value="prism">Prism maze</option>
          <option value="static">Static noise</option>
          <option value="scanlines">Glitch scanlines</option>
          <option value="hypno">Hypno grid</option>
          <option value="none">Clean</option>
        </select>
      </div>

      <div class="control-row">
        <div class="control-block">
          <label class="control-label" for="layoutSelect">Layout</label>
          <select id="layoutSelect" class="control-input">
            <option value="strip">Classic Strip</option>
            <option value="polaroid">Polaroid Frame</option>
            <option value="magazine">Magazine Cover</option>
            <option value="grid">2x2 Grid Sheet</option>
          </select>
        </div>
        <div class="control-block">
          <label class="control-label" for="photoFilterSelect">Photo Filter</label>
          <select id="photoFilterSelect" class="control-input">
            <option value="photobooth">B&W Photobooth</option>
            <option value="vintage">35mm Film</option>
            <option value="cyber">Cyber Neon</option>
            <option value="thermal">Thermal Heat</option>
            <option value="natural">Natural Color</option>
          </select>
        </div>
      </div>

      <div class="control-block">
        <label class="control-label checkbox-label" for="liveMotionToggle">
          <input type="checkbox" id="liveMotionToggle" checked />
          <span>Live Boomerang Motion</span>
        </label>
      </div>

      <div class="control-row">
        <div class="control-block">
          <label class="control-label" for="bgColorInput">Background</label>
          <input id="bgColorInput" class="color-input" type="color" value="#070816" />
        </div>
        <div class="control-block">
          <label class="control-label" for="accentColorInput">Accent</label>
          <input id="accentColorInput" class="color-input" type="color" value="#00e5ff" />
        </div>
      </div>

      <div class="control-block">
        <label class="control-label" for="stripTitleInput">Strip title</label>
        <input id="stripTitleInput" class="control-input" type="text" maxlength="28" value="PuzzleCam Session" />
      </div>

      <div class="control-block">
        <div class="control-label">Puzzle image</div>
        <div id="imageGallery" class="image-gallery" role="listbox" aria-label="Puzzle image gallery"></div>
      </div>
    </section>

    <div class="strip-complete-msg" id="stripCompleteMsg">
      strip complete - download or reset to keep going
    </div>

    <div id="galleryStrip" class="gallery-strip">
      <div class="gallery-empty" id="galleryEmpty">
        Your completed puzzles<br/>will appear here.
      </div>
    </div>

    <div class="gallery-actions">
      <button type="button" id="downloadStripBtn" class="gallery-action-btn" disabled>Download PNG</button>
      <button type="button" id="downloadGifBtn" class="gallery-action-btn gallery-action-btn--glow" disabled>Download Animated GIF ✨</button>
      <button type="button" id="copyClipboardBtn" class="gallery-action-btn" disabled>Copy to Clipboard 📋</button>
      <button type="button" id="resetAllBtn" class="gallery-action-btn gallery-action-btn--danger">Reset all</button>
    </div>
  </aside>

  <div id="toastNotification" class="toast-notification"></div>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
